spring:
  application:
    name: Backend

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:Backend/.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/lms_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,profile,email
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/login/oauth2/code/{registrationId}}
          linkedin:
            client-id: ${LINKEDIN_CLIENT_ID:}
            client-secret: ${LINKEDIN_CLIENT_SECRET:}
            provider: linkedin
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: ${LINKEDIN_REDIRECT_URI:http://localhost:8080/api/login/oauth2/code/{registrationId}}
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub
          linkedin:
            authorization-uri: https://www.linkedin.com/oauth/v2/authorization
            token-uri: https://www.linkedin.com/oauth/v2/accessToken
            user-info-uri: https://api.linkedin.com/v2/userinfo
            jwk-set-uri: https://www.linkedin.com/oauth/openid/jwks
            user-name-attribute: sub

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/api}
  forward-headers-strategy: framework

app:
  frontend-urls: ${FRONTEND_URLS:${FRONTEND_URL:http://localhost:3000,http://localhost:5173,https://ingage-lms.vercel.app}}
  frontend-oauth-success-url: ${FRONTEND_OAUTH_SUCCESS_URL:${FRONTEND_URL:${FRONTEND_BASE_URL:${CLIENT_URL:${APP_FRONTEND_URL:https://ingage-lms.vercel.app/oauth/callback}}}}}
  frontend-reset-password-url: ${FRONTEND_RESET_PASSWORD_URL:https://ingage-lms.vercel.app/reset-password}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:}
    secret: ${RAZORPAY_KEY_SECRET:}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:test_webhook_secret}
